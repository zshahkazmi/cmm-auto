name: Outreach auto (directory feed)

# PARALLEL directory -> outreach engine (v3). Six runners work at the
# same time, around the clock. Every runner pulls its own batch from
# the directory sheet's endpoint; the endpoint CLAIMS each batch
# atomically (12-hour lock), so two runners can never take the same
# business, and every outcome is recorded in the sheet's Outreach
# ledger — a business with a final outcome is never handed out again.
#
# NOTHING is committed back to this repo: results are written to the
# sheet ledger only.
#
# One-time setup in this repo (Settings -> Secrets and variables -> Actions):
#   OUTREACH_CONFIG      the formscout submit config (same as cmm-outreach)
#   MAPSCOUT_API_URL     the directory sheet's Apps Script web app URL
#   MAPSCOUT_API_TOKEN   the token from the top of Code.gs
#
# Requires Code.gs v3 (claim support) deployed on the sheet endpoint.
# The per-runner limit below applies to EACH of the 6 runners
# (default 120 each = up to 720 businesses per wave).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max businesses PER RUNNER this wave"
        type: string
        default: "120"

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    concurrency:
      group: outreach-auto-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get formscout
        run: git clone --depth 1 https://github.com/zshahkazmi/formscout.git formscout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + Chromium
        run: |
          pip install requests
          cd formscout
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Write config from secret
        env:
          OUTREACH_CONFIG: ${{ secrets.OUTREACH_CONFIG }}
        run: printf '%s' "$OUTREACH_CONFIG" > outreach.yaml

      - name: Pull a claimed batch from the directory
        env:
          MAPSCOUT_API_URL: ${{ secrets.MAPSCOUT_API_URL }}
          MAPSCOUT_API_TOKEN: ${{ secrets.MAPSCOUT_API_TOKEN }}
        run: |
          mkdir -p leads results
          python tools/pull_directory.py pull \
            --url "$MAPSCOUT_API_URL" --token "$MAPSCOUT_API_TOKEN" \
            --limit "${{ inputs.limit || '120' }}" \
            --leads leads/auto-current.csv --keys auto-keys.json

      - name: Submit forms (live)
        run: |
          if [ "$(wc -l < leads/auto-current.csv)" -gt 1 ]; then
            cd formscout
            python -m formscout submit ../leads/auto-current.csv \
              --config ../outreach.yaml \
              -o ../results/auto-${{ github.run_id }}-${{ matrix.shard }}.csv
          else
            echo "No new businesses to contact this run."
          fi

      - name: Record the handover in the directory ledger
        if: always()
        env:
          MAPSCOUT_API_URL: ${{ secrets.MAPSCOUT_API_URL }}
          MAPSCOUT_API_TOKEN: ${{ secrets.MAPSCOUT_API_TOKEN }}
        run: |
          if [ -f "results/auto-${{ github.run_id }}-${{ matrix.shard }}.csv" ] && [ -f auto-keys.json ]; then
            python tools/pull_directory.py report \
              --url "$MAPSCOUT_API_URL" --token "$MAPSCOUT_API_TOKEN" \
              --keys auto-keys.json \
              --results "results/auto-${{ github.run_id }}-${{ matrix.shard }}.csv"
          else
            echo "No results file — nothing to record; claims expire and the businesses are retried."
          fi
